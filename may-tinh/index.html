/* Ghi trang thật khi trang mở khóa đã nạp xong (document.open lúc trình phân tích còn chạy có thể bị bỏ qua,

function put(html){var done=false;function go(){if(done)return;done=true;var m=document.getElementById("mo");if(m&&m.parentNode)m.parentNode.removeChild(m);
document.open();document.write(html);document.close()}
if(document.readyState==="complete")setTimeout(go,0);else{window.addEventListener("load",function(){setTimeout(go,0)},false);setTimeout(go,3000)}}
function ask(ok,fail){var x=new XMLHttpRequest();x.open("POST",window.API_URL,true);x.setRequestHeader("Content-Type","text/plain;charset=utf-8");x.timeout=20000;
x.onload=function(){var d=null;try{d=JSON.parse(x.responseText)}catch(e){}ok(d)};x.onerror=x.ontimeout=fail;
x.send(JSON.stringify({action:"appKey",app:"mt",token:g("ttm_token")}))}
function fresh(){ask(function(d){
if(d&&d.ok&&d.key){s(LS,d.key);open(d.key)["catch"](function(){s(LS,null);msg("Chìa khóa trên máy chủ không khớp với bản web này. Báo thầy Minh kiểm tra APP_KEY_MT.")});return}
if(d&&(d.code===401||d.code===403))s(LS,null);else msg(d&&d.error?d.error:"Không mở được máy tính. Hãy tải lại trang.")
},function(){msg("Không kết nối được máy chủ để mở máy tính. Kiểm tra mạng rồi tải lại trang.")})}
if(!cs||!window.Uint8Array||!window.Promise){msg("Trình duyệt này cũ quá để mở máy tính. Hãy cập nhật trình duyệt hoặc dùng máy khác.");return}
if(!g("ttm_token")||!window.API_URL)return;
var c=g(LS);
if(c){open(c)["catch"](function(){s(LS,null);fresh()});ask(function(d){if(d&&(d.code===401||d.code===403))s(LS,null)},function(){})}
else fresh();
})();
